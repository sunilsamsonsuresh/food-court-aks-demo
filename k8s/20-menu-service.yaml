# menu-service: returns the dishes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: food-court
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      containers:
        - name: menu-service
          image: foodcourt48516.azurecr.io/menu-service:v1   # from your registry
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# No "type:" means ClusterIP: reachable ONLY inside the cluster,
# like the unpublished services in docker compose.
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: food-court
spec:
  selector:
    app: menu-service
  ports:
    - port: 8000
      targetPort: 8000
